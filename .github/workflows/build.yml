name: Build

on:
  push:
    tags:
    - '*''
    branches-ignore:
    - '**'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.set.outputs.arch }}
    steps:
      - id: set
        run: |
          case "${{ inputs.arch }}" in
            amd) echo 'arch=["amd"]' >>"$GITHUB_OUTPUT" ;;
            arm) echo 'arch=["arm"]' >>"$GITHUB_OUTPUT" ;;
            *)   echo 'arch=["amd","arm"]' >>"$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.arch) }}
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      # The scripts write the .deb to ../dist relative to the repo, so check
      # out into a subdirectory to keep that path inside the workspace.
      - uses: actions/checkout@v5
        with:
          path: packages

      # The runner ships with large SDKs the build never uses; drop them so
      # k3s images and the .deb fit on disk. Go (prepare.sh) is kept.
      - name: clean space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Show environment
        run: |
          uname -m
          dpkg --print-architecture

      - name: setup
        run: ./setup.sh
        working-directory: packages

      - name: prepare
        run: ./prepare.sh
        working-directory: packages

      - name: package
        run: sudo -E ./package.sh openserverless
        working-directory: packages ${{github.refname}}

      - name: publish
        env:
          TRUPUB_ENDPOINT: ${{ secrets.TRUPUB_ENDPOINT }}
          TRUPUB_REGION: ${{ secrets.TRUPUB_REGION }}
          TRUPUB_KEY: ${{ secrets.TRUPUB_KEY }}
          TRUPUB_SECRET: ${{ secrets.TRUPUB_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # package.sh runs under sudo, so the artifacts are root-owned.
          sudo chown -R "$(id -u):$(id -g)" ../dist
          ./publish.sh
        working-directory: packages

      - name: index
        env:
          TRUPUB_ENDPOINT: ${{ secrets.TRUPUB_ENDPOINT }}
          TRUPUB_REGION: ${{ secrets.TRUPUB_REGION }}
          TRUPUB_KEY: ${{ secrets.TRUPUB_KEY }}
          TRUPUB_SECRET: ${{ secrets.TRUPUB_SECRET }}
        run: ./index.sh
        working-directory: packages
