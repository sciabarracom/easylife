# k3s drop-in installed by prepare.sh when trustant is deployed, and shipped in
# the package under /etc/systemd/system/k3s.service.d/.
#
# Ports 80/443/6443 accept connections only from localhost, on every interface
# and for both IPv4 and IPv6. The TRUSTANT chain in the raw table lets through
# loopback and the k3s pod network (cni0, flannel.1: pods reach the API server
# and each other on these ports) and drops everything else. The chain is
# rebuilt at every k3s start and removed when k3s stops.
[Service]
ExecStartPre=-/sbin/iptables -t raw -N TRUSTANT
ExecStartPre=/sbin/iptables -t raw -F TRUSTANT
ExecStartPre=/sbin/iptables -t raw -A TRUSTANT -i lo -j RETURN
ExecStartPre=/sbin/iptables -t raw -A TRUSTANT -i cni0 -j RETURN
ExecStartPre=/sbin/iptables -t raw -A TRUSTANT -i flannel.1 -j RETURN
ExecStartPre=/sbin/iptables -t raw -A TRUSTANT -p tcp -m multiport --dports 80,443,6443 -j DROP
ExecStartPre=/bin/sh -c '/sbin/iptables -t raw -C PREROUTING -j TRUSTANT 2>/dev/null || /sbin/iptables -t raw -I PREROUTING -j TRUSTANT'
ExecStartPre=-/sbin/ip6tables -t raw -N TRUSTANT
ExecStartPre=/sbin/ip6tables -t raw -F TRUSTANT
ExecStartPre=/sbin/ip6tables -t raw -A TRUSTANT -i lo -j RETURN
ExecStartPre=/sbin/ip6tables -t raw -A TRUSTANT -p tcp -m multiport --dports 80,443,6443 -j DROP
ExecStartPre=/bin/sh -c '/sbin/ip6tables -t raw -C PREROUTING -j TRUSTANT 2>/dev/null || /sbin/ip6tables -t raw -I PREROUTING -j TRUSTANT'
ExecStopPost=-/sbin/iptables -t raw -D PREROUTING -j TRUSTANT
ExecStopPost=-/sbin/iptables -t raw -F TRUSTANT
ExecStopPost=-/sbin/iptables -t raw -X TRUSTANT
ExecStopPost=-/sbin/ip6tables -t raw -D PREROUTING -j TRUSTANT
ExecStopPost=-/sbin/ip6tables -t raw -F TRUSTANT
ExecStopPost=-/sbin/ip6tables -t raw -X TRUSTANT
